<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visão Geral — Painel</title>
  <link rel="stylesheet" href="assets/css/casdsa.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-brand">
      <a href="#">
        <img src="https://via.placeholder.com/130x30?text=LOGO" alt="Logótipo">
      </a>
    </div>

    <nav class="navbar-nav">
      <a href="#" class="nav-link active">Página Inicial</a>
      <div class="dropdown">
        <button class="dropdown-toggle">
          Categorias 
          <span class="arrow-down">▼</span>
        </button>
      </div>
    </nav>

    <div class="navbar-search">
      <input type="text" placeholder="Digite sua dúvida aqui...">
      <button type="submit" class="search-btn">🔍</button>
    </div>

    <div class="navbar-actions">
      <button class="btn btn-outline">+ Opções de tela</button>
      <a href="#" class="btn btn-primary">Entrar</a>
      <a href="#" class="btn btn-accent">Teste grátis</a>
    </div>
  </header>

  <main class="main-container">
    <div class="page-header">
      <h1>Tela inicial (Visão geral)</h1>
      <p class="subtitle">Organize seu painel com blocos dinâmicos conforme a sua preferência.</p>
    </div>

    <section class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <h3>Acesso Rápido</h3>
          <span class="drag-handle" title="Arrastar bloco">⠿</span>
        </div>
        <div class="card-body">
          <p>Links para relatórios, vendas e financeiro.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Resultados Diários</h3>
          <span class="drag-handle" title="Arrastar bloco">⠿</span>
        </div>
        <div class="card-body">
          <p>Resumo de orçamentos, pedidos e emissão de notas.</p>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
