<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/545e415064.js" crossorigin="anonymous"></script>


    <link rel="stylesheet" href="assets/css/style.css">

    <title>OFiCINA</title>
</head>


<body>
    <div class="container">
       <div class="usuario">
            <i class="fa-solid fa-circle-user"></i>
        </div>


       
        <div class="menu">
            <i class="fa-solid fa-bars"></i>
        
        </div>

    </div>
    
    <div class="logo">
        <img src="assets/images/mannel.png" alt="imagem logo"> 
    </div>

</body>
    <div class="container">
        <div class="card">
          <h1>FAÇA O SEU LOGIN!!!</h1>
          <form action="dashboard.html" method="get"> <link rel="stylesheet" href="assets/css/style.css">
            <div class="input-group">
                <label for="e_mail">E-mail</label>
                <br>

                <input 
                    type="email" 
                    name="e_mail" 
                    id="e_mail" 
                    placeholder="Digite seu E-mail aqui" 
                    required
                >

                <br><br>

                <label for="senha">Senha</label>
                <br>

                <input 
                    type="password" 
                    name="senha" 
                    id="senha" 
                    placeholder="Digite sua senha aqui" 
                    minlength="8" 
                    required
                >

                <br><br>

            </div>

            <div class="lembrar">

                <input 
                    type="checkbox" 
                    name="lembrar" 
                    id="lembrar"
                >

                <label for="lembrar">Lembrar-me</label>

                <br><br>

            </div>

            <button type="submit" name="login">
                Entrar
            </button>

            <br><br>

        </form>

        <div class="rodape_login">

            <a href="cadastro.html">
                Não tenho cadastro
            </a>

            <a href="esqueci_senha.html">
                Esqueci minha senha
            </a>

        </div>

    </div>

</div>

</body>

</html>
