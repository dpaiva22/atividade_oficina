<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/style.css">

    <title>OFICINA</title>
</head>

<body>

    <div class="logo">
        <img src="assets/images/mannel.png" alt="Imagem logo">
    </div>

    <div class="container">

        <form action="dashboard.html" method="get">

            <div class="input-group">

                <label for="e_mail">E-MAIL</label>
                <input
                    type="email"
                    name="e_mail"
                    id="e_mail"
                    placeholder="Digite seu E-mail aqui"
                    required
                >

                <label for="senha">SENHA</label>
                <input
                    type="password"
                    name="senha"
                    id="senha"
                    placeholder="Digite sua senha aqui"
                    minlength="8"
                    required
                >

            </div>

            <div class="lembrar">
                <input
                    type="checkbox"
                    name="lembrar"
                    id="lembrar"
                >
                <label for="lembrar">LEMBRA-ME</label>
            </div>

            <button type="submit" name="login">
                Entrar
            </button>

        </form>

        <div class="rodape_login">

            <a href="cadastro.html">
                Não tenho cadastro
            </a>

            <a href="esqueci_senha.html">
                Esqueci minha senha
            </a>

        </div>

    </div>

</body>

</html>
